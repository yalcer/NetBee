#!/usr/sbin/nft -f
# NetBee OS - Stateful Firewall & NAT Ruleset

flush ruleset

include "/etc/nftables.vars"

table inet netbee_fw {
    # Modular custom chains populated by /etc/nftables.d/*.nft (evaluated BEFORE default LAN->WAN accept)
    chain custom_input {
    }

    chain custom_forward {
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Allow loopback
        iifname "lo" accept

        # Log (rate-limited) and drop invalid packets early
        ct state invalid limit rate 5/minute log prefix "netbee-invalid: " drop
        ct state invalid drop

        # Allow established/related traffic
        ct state established,related accept

        # Allow ICMP / ICMPv6 (rate limited)
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } limit rate 10/second accept

        # Evaluate user/UI custom input rules (e.g. WireGuard WAN expose, custom blocks/allows)
        jump custom_input

        # LAN SSH with brute-force rate limiting
        iifname $LAN_IF tcp dport 22 ct state new limit rate 10/minute burst 15 packets accept

        # LAN management (Web UI 80/443, AdGuardHome 3000) & core router services (DNS/DHCP/NTP)
        iifname $LAN_IF tcp dport { 80, 443, 3000 } accept
        iifname $LAN_IF udp dport { 53, 67, 68, 123 } accept
        iifname $LAN_IF tcp dport 53 accept

        # WireGuard VPN clients -> Router DNS, NTP, Web UI & SSH
        iifname $WG_IF udp dport { 53, 123 } accept
        iifname $WG_IF tcp dport { 53, 80, 443 } accept
        iifname $WG_IF tcp dport 22 ct state new limit rate 10/minute burst 15 packets accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Drop invalid packets
        ct state invalid drop

        # TCP MSS clamping for PPPoE / ONT WAN MTU compatibility
        oifname $WAN_IFS tcp flags syn tcp option maxseg size set rt mtu

        # Allow established/related return traffic
        ct state established,related accept

        # Evaluate user/UI custom forward rules (custom blocks AND DNAT forward accepts) BEFORE default LAN->WAN accept
        jump custom_forward

        # Allow LAN -> WAN and LAN <-> WireGuard forwarding
        iifname $LAN_IF oifname $WAN_IFS accept
        iifname $LAN_IF oifname $WG_IF accept
        iifname $WG_IF oifname $LAN_IF accept
        iifname $WG_IF oifname $WAN_IFS accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip netbee_nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # NAT (Masquerade) outbound traffic on WAN interfaces
        oifname $WAN_IFS masquerade
    }
}

# Modular drop-in rules (Port Forwarding, custom rules managed by netbeed)
include "/etc/nftables.d/*.nft"
