# NetBee OS - Chrony NTP Client & Local LAN Time Server

# IP-based anycast fallback NTP servers (work even if clock is 1970 before DoH TLS)
server 162.159.200.1 iburst
server 162.159.200.123 iburst

# Regional & global NTP pools
pool tr.pool.ntp.org iburst
pool pool.ntp.org iburst

# Persist clock drift across reboots
driftfile /var/lib/chrony/drift

# Always step system clock if offset > 1s (recovers cleanly from 1970 on RTC-less boot)
makestep 1.0 -1

# Sync kernel RTC
rtcsync

# Serve accurate NTP time to LAN and WireGuard clients
allow 192.168.10.0/24
local stratum 10
