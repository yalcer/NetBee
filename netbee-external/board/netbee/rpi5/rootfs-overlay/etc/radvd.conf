# NetBee OS - IPv6 Router Advertisement (SLAAC) on LAN
# Automatically advertises any global /64 prefix delegated onto eth0 via dhcpcd.

interface eth0
{
    AdvSendAdvert on;
    IgnoreIfMissing on;
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 100;

    prefix ::/64
    {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr off;
    };
};
