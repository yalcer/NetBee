# NetBee OS - Router & Firewall Kernel Parameters

# Reboot automatically 3s after a kernel panic
kernel.panic = 3

# Enable eBPF JIT compiler & fq_codel default qdisc for low-latency Gigabit routing
net.core.bpf_jit_enable = 1
net.core.default_qdisc = fq_codel
net.core.netdev_max_backlog = 4096

# Enable IPv4 and IPv6 packet forwarding
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# Anti-spoofing (Reverse Path Filtering)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# SYN flood protection & TCP hygiene
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_keepalive_time = 120

# Ignore ICMP redirects & source routing
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0

# Ignore broadcast & bogus ICMP responses
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Conntrack accounting, timeouts & socket buffer tuning (QUIC/DoH/2.5GbE)
net.netfilter.nf_conntrack_max = 131072
net.netfilter.nf_conntrack_acct = 1
net.netfilter.nf_conntrack_tcp_timeout_established = 7440
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 180
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

