# NetBee OS - dhcpcd Configuration (WAN IPv4/IPv6-PD only)
# Never touch the static LAN interface (eth0)
denyinterfaces eth0

duid
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option host_name
require dhcp_server_identifier
slaac private

# Example IPv6 Prefix Delegation (uncomment for FTTH/ONT IPv6 ISP):
# interface ppp0
#     ipv6rs
#     ia_na 1
#     ia_pd 2 eth0/0

